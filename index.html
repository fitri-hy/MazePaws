        class SaveSystem {
            constructor() {
                this.defaults = { money: 0.0, unlockedPets: ['bunny'], selectedPet: 'bunny', highScore: 0, totalGems: 0, levelDifficulty: 1 };
                this.data = { ...this.defaults };
                this.load();

            load() {
                const stored = localStorage.getItem('pet_dungeon_save_v2');
                if (stored) {
                    try { this.data = JSON.parse(stored); } catch(e) { this.data = { ...this.defaults }; }
                }
            }
            save() { localStorage.setItem('pet_dungeon_save_v2', JSON.stringify(this.data)); }
            reset() { this.data = JSON.parse(JSON.stringify(this.defaults)); this.save(); }
        }

        // ==========================================
        // SYNTHESIZED WEB AUDIO MANAGER
        // ==========================================
        class AudioManager {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playClick() { this.beep(440, 0.05, 'square'); }
            playCollect() { this.beep(880, 0.08, 'sine'); setTimeout(() => this.beep(1320, 0.1, 'sine'), 40); }
            playWin() { this.beep(523.25, 0.1, 'triangle'); setTimeout(() => this.beep(659.25, 0.1, 'triangle'), 100); setTimeout(() => this.beep(783.99, 0.3, 'triangle'), 200); }
            playBuy() { this.beep(587.33, 0.1, 'sine'); setTimeout(() => this.beep(1174.66, 0.2, 'sine'), 80); }
            playError() { this.beep(150, 0.2, 'sawtooth'); }
            beep(freq, duration, type = 'sine') {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
        }

        // ==========================================
        // MAZE GENERATOR
        // ==========================================
        class MazeGenerator {
            static generate(width, height) {
                let grid = Array(height).fill(null).map(() => Array(width).fill(1));
                let stack = [];
                
                grid[1][1] = 0;
                stack.push([1, 1]);

                while(stack.length > 0) {
                    let [cx, cy] = stack[stack.length - 1];
                    let neighbors = [];
                    let dirs = [[0,-2],[0,2],[-2,0],[2,0]];

                    for(let [dx, dy] of dirs) {
                        let nx = cx + dx, ny = cy + dy;
                        if(nx > 0 && nx < width - 1 && ny > 0 && ny < height - 1 && grid[ny][nx] === 1) {
                            neighbors.push([nx, ny, dx, dy]);
                        }
                    }

                    if(neighbors.length > 0) {
                        let [nx, ny, dx, dy] = neighbors[Math.floor(Math.random() * neighbors.length)];
                        grid[cy + dy/2][cx + dx/2] = 0;
                        grid[ny][nx] = 0;
                        stack.push([nx, ny]);
                    } else {
                        stack.pop();
                    }
                }

                // Buat jalan alternatif agar tidak terlalu linier
                for(let y=2; y<height-2; y += 2) {
                    for(let x=2; x<width-2; x += 2) {
                        if(grid[y][x] === 1 && Math.random() < 0.25) {
                            grid[y][x] = 0;
                        }
                    }
                }

                grid[1][1] = 0;
                grid[height-2][width-2] = 0;
                grid[height-2][width-3] = 0; 
                
                return grid;
            }
        }

        // ==========================================
        // HYBRID CONTROL CONTROLLER
        // ==========================================
        class InputController {
            constructor() {
                this.keys = { up: false, down: false, left: false, right: false };
                this.vector = new THREE.Vector2(0, 0);
                this.isMobile = false;

                window.addEventListener('keydown', (e) => this.updateKeys(e.code, true));
                window.addEventListener('keyup', (e) => this.updateKeys(e.code, false));
                this.initJoystick();
            }

            updateKeys(code, isPressed) {
                if(code === 'KeyW' || code === 'ArrowUp') this.keys.up = isPressed;
                if(code === 'KeyS' || code === 'ArrowDown') this.keys.down = isPressed;
                if(code === 'KeyA' || code === 'ArrowLeft') this.keys.left = isPressed;
                if(code === 'KeyD' || code === 'ArrowRight') this.keys.right = isPressed;
                this.calculateVector();
            }

            calculateVector() {
                let vx = 0, vy = 0;
                if(this.keys.up) vy = -1; // Maju
                if(this.keys.down) vy = 1; // Mundur
                if(this.keys.left) vx = -1; // Belok Kiri
                if(this.keys.right) vx = 1; // Belok Kanan
                this.vector.set(vx, vy); 
            }

            initJoystick() {
                const zone = document.getElementById('joystick-zone');
                const stick = document.getElementById('joystick-stick');
                if(!zone || !stick) return;

                if('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                    this.isMobile = true;
                    zone.classList.remove('hidden');
                    zone.classList.add('block');
                }

                let active = false;
                let startX = 0, startY = 0;

                const onStart = (e) => {
                    active = true;
                    let touch = e.touches ? e.touches[0] : e;
                    startX = touch.clientX;
                    startY = touch.clientY;
                };

                const onMove = (e) => {
                    if(!active) return;
                    let touch = e.touches ? e.touches[0] : e;
                    let dx = touch.clientX - startX;
                    let dy = touch.clientY - startY;
                    let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
                    let angle = Math.atan2(dy, dx);

                    let mx = Math.cos(angle) * dist;
                    let my = Math.sin(angle) * dist;

                    stick.style.transform = `translate(${mx}px, ${my}px)`;
                    
                    let vx = Math.cos(angle) * (dist / 45);
                    let vy = Math.sin(angle) * (dist / 45);
                    this.vector.set(vx, vy);
                };

                const onEnd = () => {
                    if(!active) return;
                    active = false;
                    stick.style.transform = `translate(0px, 0px)`;
                    this.vector.set(0, 0);
                };

                zone.addEventListener('touchstart', onStart);
                window.addEventListener('touchmove', onMove);
                window.addEventListener('touchend', onEnd);
            }
        }

        // ==========================================
        // MAIN GAME ENGINE
        // ==========================================
        class PetDungeonGame {
            constructor() {
                this.saveSystem = new SaveSystem();
                this.audio = new AudioManager();
                this.input = new InputController();
                
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                
                this.isPlaying = false;
                this.mazeData = [];
                this.mazeWidth = 15;
                this.mazeHeight = 15;
                this.blockSize = 3.5;
                
                this.playerMesh = null;
                this.gemsGroup = [];
                this.particles = [];
                this.dungeonDust = [];
                this.exitMesh = null;
                this.exitLight = null;
                this.exitRings = [];
                
                this.currentGemsCollected = 0;
                this.elapsedTime = 0;
                this.timerInterval = null;
                this.miniMapUnlocked = false;

                this.gltfLoader = new THREE.GLTFLoader();
                this.textureLoader = new THREE.TextureLoader();
                this.petTexture = null;

                this.initEngine();
                this.initShopPreviewEngine();
                this.animate();
            }

            initEngine() {
                const container = document.getElementById('canvas-container');
                this.scene = new THREE.Scene();
                
                // Tema Terang (Light Theme Sky & Fog)
                this.scene.background = new THREE.Color(0xf1f5f9);
                this.scene.fog = new THREE.FogExp2(0xf1f5f9, 0.04);

                this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.0;
                container.appendChild(this.renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
                this.scene.add(ambientLight);

                this.dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
                this.dirLight.castShadow = true;
                this.dirLight.shadow.mapSize.width = 2048;
                this.dirLight.shadow.mapSize.height = 2048;
                this.dirLight.shadow.bias = -0.0001;
                this.scene.add(this.dirLight);

                this.petTexture = this.textureLoader.load('assets/peth/Models/GLB/Textures/colormap.png');
                this.petTexture.flipY = false;

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            initShopPreviewEngine() {
                const canvas = document.getElementById('shop-preview-canvas');
                this.shopRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
                this.shopRenderer.setSize(380, 180);
                this.shopRenderer.shadowMap.enabled = true;

                this.shopScene = new THREE.Scene();
                this.shopCamera = new THREE.PerspectiveCamera(40, 380 / 180, 0.1, 100);
                this.shopCamera.position.set(0, 2.5, 4.5);
                this.shopCamera.lookAt(0, 0.6, 0);

                const ambient = new THREE.AmbientLight(0xffffff, 1.0);
                this.shopScene.add(ambient);

                const dir = new THREE.DirectionalLight(0xfffbeb, 1.2);
                dir.position.set(5, 10, 5);
                this.shopScene.add(dir);

                this.previewGroup = new THREE.Group();
                this.shopScene.add(this.previewGroup);
                this.selectedPreviewPetId = 'bunny';
            }

            startRun() {
                this.audio.init();
                this.audio.playClick();
                
                const difficulty = this.saveSystem.data.levelDifficulty || 1;
                
                // Kalkulasi ukuran labirin menggunakan batasan dari GAME_SETTINGS
                let calculatedWidth = GAME_SETTINGS.baseMazeWidth + ((difficulty - 1) * GAME_SETTINGS.sizeMultiplier);
                let calculatedHeight = GAME_SETTINGS.baseMazeHeight + ((difficulty - 1) * GAME_SETTINGS.sizeMultiplier);
                
                // Batasi ukuran agar tidak melebihi batas maksimum yang dikonfigurasi
                this.mazeWidth = Math.min(calculatedWidth, GAME_SETTINGS.maxMazeWidth);
                this.mazeHeight = Math.min(calculatedHeight, GAME_SETTINGS.maxMazeHeight);

                // Validasi agar dimensi labirin selalu bernilai ganjil demi kestabilan Maze Generator DFS
                if (this.mazeWidth % 2 === 0) this.mazeWidth += 1;
                if (this.mazeHeight % 2 === 0) this.mazeHeight += 1;

                this.currentGemsCollected = 0;
                this.elapsedTime = 0;
                this.miniMapUnlocked = false;
                document.getElementById('minimap-container').style.display = 'none';

                this.clearScene();
                this.mazeData = MazeGenerator.generate(this.mazeWidth, this.mazeHeight);
                this.build3DGrid();
                this.spawnDungeonDust();

                const activePetId = this.saveSystem.data.selectedPet;
                this.loadActivePlayerPet(activePetId);

                document.getElementById('menu-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                this.updateHUD();

                // Tampilkan minimap langsung di detik ke-0 jika diizinkan secara instan
                if (GAME_SETTINGS.enableMinimap && GAME_SETTINGS.minimapUnlockTime === 0) {
                    this.miniMapUnlocked = true;
                    document.getElementById('minimap-container').style.display = 'block';
                }

                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    this.elapsedTime++;
                    this.updateHUD();
                    
                    // Aktifkan minimap seiring berjalannya waktu jika fiturnya diaktifkan
                    if(GAME_SETTINGS.enableMinimap && !this.miniMapUnlocked && this.elapsedTime >= GAME_SETTINGS.minimapUnlockTime) {
                        this.miniMapUnlocked = true;
                        document.getElementById('minimap-container').style.display = 'block';
                    }
                }, 1000);

                this.isPlaying = true;
            }

            build3DGrid() {
                // Tembok Utama Labirin (Aksen Terang Putih Mutiara)
                const wallGeo = new THREE.BoxGeometry(this.blockSize, 3, this.blockSize);
                const wallMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 });
                
                // Aksen Trim Bagian Atas Tembok agar Outline Terlihat Jelas & Cantik
                const trimGeo = new THREE.BoxGeometry(this.blockSize * 1.02, 0.15, this.blockSize * 1.02);
                const trimMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.5 });

                const floorGeo = new THREE.PlaneGeometry(this.mazeWidth * this.blockSize, this.mazeHeight * this.blockSize);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.set((this.mazeWidth * this.blockSize)/2 - this.blockSize/2, 0, (this.mazeHeight * this.blockSize)/2 - this.blockSize/2);
                floor.receiveShadow = true;
                this.scene.add(floor);

                this.wallMeshes = [];

                for(let y=0; y<this.mazeHeight; y++) {
                    for(let x=0; x<this.mazeWidth; x++) {
                        let cell = this.mazeData[y][x];
                        let px = x * this.blockSize;
                        let pz = y * this.blockSize;

                        if(cell === 1) {
                            // Gabungkan tembok utama dan trim atasnya
                            const wallGroup = new THREE.Group();
                            wallGroup.position.set(px, 1.5, pz);

                            let wMesh = new THREE.Mesh(wallGeo, wallMat);
                            wMesh.castShadow = true;
                            wMesh.receiveShadow = true;
                            wallGroup.add(wMesh);

                            let tMesh = new THREE.Mesh(trimGeo, trimMat);
                            tMesh.position.y = 1.5;
                            tMesh.castShadow = true;
                            wallGroup.add(tMesh);

                            this.scene.add(wallGroup);
                            this.wallMeshes.push(wallGroup);

                            // Pasang Obor Dinding Estetik (Torch) secara acak di persimpangan
                            if(Math.random() < 0.12 && x > 0 && x < this.mazeWidth - 1 && y > 0 && y < this.mazeHeight - 1) {
                                this.spawnWallTorch(px, pz);
                            }
                        } else {
                            if((x !== 1 || y !== 1) && (x !== this.mazeWidth-2 || y !== this.mazeHeight-2)) {
                                if(Math.random() < 0.2) {
                                    this.spawnGem(px, pz);
                                }
                            }
                        }
                    }
                }

                // Portal Finish Mewah dengan Efek Aura Cincin
                const fx = (this.mazeWidth - 2) * this.blockSize;
                const fz = (this.mazeHeight - 2) * this.blockSize;
                
                const exitGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.2, 32);
                const exitMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 0.3, roughness: 0.1 });
                this.exitMesh = new THREE.Mesh(exitGeo, exitMat);
                this.exitMesh.position.set(fx, 0.1, fz);
                this.scene.add(this.exitMesh);

                this.exitLight = new THREE.PointLight(0xf59e0b, 2.5, 8);
                this.exitLight.position.set(fx, 2, fz);
                this.scene.add(this.exitLight);

                // Tambahkan Cincin Energi Portal Berputar
                this.exitRings = [];
                for(let i=0; i<2; i++) {
                    const ringGeo = new THREE.TorusGeometry(0.8 - i*0.25, 0.08, 8, 24);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.8 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.position.set(fx, 0.4, fz);
                    ring.rotation.x = Math.PI / 2;
                    this.scene.add(ring);
                    this.exitRings.push(ring);
                }
            }

            // Melahirkan Obor Dinding bercahaya hangat
            spawnWallTorch(x, z) {
                const torchGroup = new THREE.Group();
                torchGroup.position.set(x, 1.3, z);

                // Tiang Obor Hitam
                const poleGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8);
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 });
                const pole = new THREE.Mesh(poleGeo, poleMat);
                pole.rotation.x = Math.PI / 6; // Miring menjorok keluar
                torchGroup.add(pole);

                // Kepala Obor / Api Bersinar
                const flameGeo = new THREE.SphereGeometry(0.18, 12, 12);
                const flameMat = new THREE.MeshBasicMaterial({ color: 0xf97316 });
                const flame = new THREE.Mesh(flameGeo, flameMat);
                flame.position.set(0, 0.35, 0.18);
                torchGroup.add(flame);

                // Cahaya Terang Obor Dinamis
                const torchLight = new THREE.PointLight(0xf97316, 1.2, 6);
                torchLight.position.set(0, 0.5, 0.2);
                torchGroup.add(torchLight);

                this.scene.add(torchGroup);
                this.wallMeshes.push(torchGroup); // Masukkan ke pembersihan scene
            }

            // Melahirkan partikel debu dungeon magis yang melayang perlahan
            spawnDungeonDust() {
                const particleCount = Math.min(this.mazeWidth * this.mazeHeight, 80);
                for(let i=0; i<particleCount; i++) {
                    const pGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
                    const pMat = new THREE.MeshBasicMaterial({ 
                        color: 0xfde047, 
                        transparent: true, 
                        opacity: Math.random() * 0.4 + 0.1 
                    });
                    const p = new THREE.Mesh(pGeo, pMat);
                    
                    p.position.set(
                        Math.random() * this.mazeWidth * this.blockSize,
                        Math.random() * 3.5,
                        Math.random() * this.mazeHeight * this.blockSize
                    );
                    
                    p.userData = {
                        speedY: Math.random() * 0.2 + 0.1,
                        rotSpeed: Math.random() * 0.02
                    };

                    this.scene.add(p);
                    this.dungeonDust.push(p);
                }
            }

            spawnGem(x, z) {
                let rand = Math.random();
                let config = GEM_TYPES[0];
                let cum = 0;
                for(let g of GEM_TYPES) {
                    cum += g.chance;
                    if(rand <= cum) { config = g; break; }
                }

                const gemGeo = new THREE.OctahedronGeometry(0.35, 0);
                const gemMat = new THREE.MeshStandardMaterial({ 
                    color: config.color, 
                    emissive: config.color, 
                    emissiveIntensity: 0.8, 
                    roughness: 0.1 
                });
                const mesh = new THREE.Mesh(gemGeo, gemMat);
                mesh.position.set(x, 0.8, z);
                mesh.userData = { 
                    type: config.type, 
                    value: config.value,
                    baseY: 0.8,
                    pulseOffset: Math.random() * Math.PI * 2
                };
                
                this.scene.add(mesh);
                this.gemsGroup.push(mesh);
            }

            loadActivePlayerPet(petId) {
                const petConfig = PET_DATABASE.find(p => p.id === petId) || PET_DATABASE[0];
                
                if(this.playerMesh) {
                    this.scene.remove(this.playerMesh);
                }

                this.playerMesh = new THREE.Group();
                this.playerMesh.position.set(1 * this.blockSize, 0, 1 * this.blockSize);
                this.scene.add(this.playerMesh);

                const light = new THREE.PointLight(0xfff7ed, 1.5, 10);
                light.position.y = 2.5;
                this.playerMesh.add(light);

                const modelUrl = 'assets/peth/Models/GLB/' + petConfig.file;
                
                this.gltfLoader.load(modelUrl, (gltf) => {
                    const model = gltf.scene;
                    
                    model.scale.set(1.5, 1.5, 1.5);
                    model.position.set(0, 0, 0);
                    // Rotasi 180 derajat (Math.PI) agar model asli menghadap depan menjauhi kamera
                    model.rotation.y = Math.PI; 

                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if(this.petTexture) {
                                child.material = new THREE.MeshStandardMaterial({
                                    map: this.petTexture,
                                    roughness: 0.4,
                                    metalness: 0.1
                                });
                            }
                        }
                    });

                    this.playerMesh.add(model);
                }, undefined, (error) => {
                    console.warn("Menggunakan pet cadangan visual imut:", error);
                    const fallbackGeo = new THREE.SphereGeometry(0.65, 16, 16);
                    const fallbackMat = new THREE.MeshStandardMaterial({ color: petConfig.price === 0 ? 0xff7043 : 0x3b82f6, roughness: 0.2 });
                    const fallback = new THREE.Mesh(fallbackGeo, fallbackMat);
                    fallback.position.y = 0.65;
                    fallback.castShadow = true;
                    
                    // Indikator mata depan lurus mengarah ke sumbu depan lokal (-Z)
                    const eyeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
                    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
                    eyeL.position.set(0.2, 0.8, -0.55);
                    const eyeR = eyeL.clone();
                    eyeR.position.x = -0.2;
                    
                    this.playerMesh.add(fallback);
                    this.playerMesh.add(eyeL);
                    this.playerMesh.add(eyeR);
                });

                // Nilai dinamis ditarik dari pengaturan kamera
                const targetDist = GAME_SETTINGS.cameraDistance; 
                const targetHeight = GAME_SETTINGS.cameraHeight; 
                
                this.camera.fov = GAME_SETTINGS.cameraFOV;
                this.camera.updateProjectionMatrix();

                this.camera.position.set(
                    this.playerMesh.position.x,
                    this.playerMesh.position.y + targetHeight,
                    this.playerMesh.position.z + targetDist
                );
                this.camera.lookAt(this.playerMesh.position);
            }

            loadShopPreviewModel(petId) {
                const petConfig = PET_DATABASE.find(p => p.id === petId);
                if(!petConfig) return;

                while(this.previewGroup.children.length > 0) {
                    this.previewGroup.remove(this.previewGroup.children[0]);
                }

                const loaderElement = document.getElementById('preview-loader');
                if(loaderElement) loaderElement.classList.remove('hidden');

                const modelUrl = 'assets/peth/Models/GLB/' + petConfig.file;
                
                this.gltfLoader.load(modelUrl, (gltf) => {
                    if(loaderElement) loaderElement.classList.add('hidden');
                    const model = gltf.scene;
					model.scale.set(1.1, 1.1, 1.1);
					model.position.set(0, -0.6, 0);
                    model.rotation.y = -Math.PI / 4;

                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if(this.petTexture) {
                                child.material = new THREE.MeshStandardMaterial({
                                    map: this.petTexture,
                                    roughness: 0.4,
                                    metalness: 0.1
                                });
                            }
                        }
                    });

                    this.previewGroup.add(model);
                }, undefined, (error) => {
                    if(loaderElement) loaderElement.classList.add('hidden');
                    const fallbackGeo = new THREE.SphereGeometry(0.75, 16, 16);
                    const fallbackMat = new THREE.MeshStandardMaterial({ color: petConfig.price === 0 ? 0xff7043 : 0x3b82f6, roughness: 0.2 });
                    const fallback = new THREE.Mesh(fallbackGeo, fallbackMat);
                    fallback.position.y = 0.65;
                    this.previewGroup.add(fallback);
                });
            }

            clearScene() {
                if(this.wallMeshes) this.wallMeshes.forEach(w => this.scene.remove(w));
                if(this.gemsGroup) this.gemsGroup.forEach(g => this.scene.remove(g));
                if(this.exitMesh) this.scene.remove(this.exitMesh);
                if(this.playerMesh) this.scene.remove(this.playerMesh);
                this.playerMesh = null;
                this.gemsGroup = [];
                this.particles.forEach(p => this.scene.remove(p));
                this.particles = [];
                this.dungeonDust.forEach(d => this.scene.remove(d));
                this.dungeonDust = [];
                this.exitRings.forEach(r => this.scene.remove(r));
                this.exitRings = [];
            }

            updateHUD() {
                const petConfig = PET_DATABASE.find(p => p.id === this.saveSystem.data.selectedPet) || PET_DATABASE[0];
                document.getElementById('hud-pet-name').innerText = petConfig.name;
                document.getElementById('hud-gems').innerText = this.currentGemsCollected;
                
                // Live Score calculation in HUD
                let score = (this.currentGemsCollected * 150) + Math.max(0, 5000 - (this.elapsedTime * 15));
                document.getElementById('hud-score').innerText = score;
                document.getElementById('hud-money').innerText = this.saveSystem.data.money.toFixed(2);
                
                let m = Math.floor(this.elapsedTime / 60).toString().padStart(2, '0');
                let s = (this.elapsedTime % 60).toString().padStart(2, '0');
                document.getElementById('hud-timer').innerText = `${m}:${s}`;
            }

            giveUp() {
                this.audio.playError();
                this.endSession(false);
            }

            endSession(isWin = false) {
                this.isPlaying = false;
                clearInterval(this.timerInterval);

                if(isWin) {
                    this.audio.playWin();
                    let earning = (this.currentGemsCollected * 0.05) + GAME_SETTINGS.victoryBonus;
					this.saveSystem.data.money += earning;
					this.saveSystem.data.totalGems += this.currentGemsCollected;
                    
                    // Formula Skor Speedrun Kompetitif
                    let finalScore = (this.currentGemsCollected * 150) + Math.max(0, 5000 - (this.elapsedTime * 15));
                    if(finalScore < 0) finalScore = 0;
                    if(finalScore > this.saveSystem.data.highScore) {
                        this.saveSystem.data.highScore = finalScore;
                    }

                    this.saveSystem.data.levelDifficulty += 1;
                    this.saveSystem.save();

                    ModalSystem.show(
                        "Level Selesai!", 
                        `Kamu Berhasil Kabur!\n\nSkor: ${finalScore}\nUang terkumpul: +${earning.toFixed(2)}\nWaktu Tempuh: ${this.elapsedTime} Detik.`,
                        () => { this.goToMenu(); }
                    );
                } else {
                    let earning = this.currentGemsCollected * 0.05;
                    this.saveSystem.data.money += earning;
                    this.saveSystem.save();

                    ModalSystem.show(
                        "Tantangan Selesai", 
                        `Kamu memutuskan keluar dari dungeon.\n\nUang terkumpul: +${earning.toFixed(2)}\nGems didapat: ${this.currentGemsCollected}`,
                        () => { this.goToMenu(); }
                    );
                }
            }

            goToMenu() {
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('minimap-container').style.display = 'none';
                document.getElementById('menu-screen').classList.remove('hidden');
            }

            renderShop() {

							<path fill="none" stroke="#6B4B46" stroke-miterlimit="10" stroke-width="5" d="M71.16 48.99c-12.67 27.06-14.85 61.23-14.85 61.23" />
							<path fill="#6D4C41" d="M81.67 31.96c8.44 2.75 10.31 10.38 9.7 12.46c-.73 2.44-10.08-7.06-23.98-6.49c-4.86.2-3.45-2.78-1.2-4.5c2.97-2.27 7.96-3.91 15.48-1.47" />
							<path fill="#6B4B46" d="M81.67 31.96c8.44 2.75 10.31 10.38 9.7 12.46c-.73 2.44-10.08-7.06-23.98-6.49c-4.86.2-3.45-2.78-1.2-4.5c2.97-2.27 7.96-3.91 15.48-1.47" />
							<path fill="#E2A610" d="M96.49 58.86c1.06-.73 4.62.53 5.62 7.5c.49 3.41.64 6.71.64 6.71s-4.2-3.77-5.59-6.42c-1.75-3.35-2.43-6.59-.67-7.79" />
						</svg>
						${pet.price}</span>`;

                    let selectedClass = isSelectedInView ? 'border-orange-500 bg-orange-50/50 shadow-md ring-1 ring-orange-400' : 'border-slate-200 bg-slate-50 hover:bg-slate-100/80';

                    let itemHtml = `
                        <div class="flex flex-col justify-between p-4 border-2 rounded-2xl cursor-pointer transition-all h-32 ${selectedClass}" onclick="game.selectShopItem('${pet.id}')">
                            <div class="flex items-center gap-3">
                                <div class="bg-white p-1 rounded-xl border border-slate-100 shadow-sm shrink-0">
                                    ${pet.svg}
                                </div>
                                <div class="flex flex-col gap-0.5">
                                    <div class="font-extrabold text-slate-900 text-base leading-tight">${pet.name}</div>
                                    <div class="text-xs font-bold ${pet.color}">${pet.rarity}</div>
                                </div>
                            </div>
                            <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-100">
                                <span class="text-xs font-semibold text-slate-500">Kecepatan: <span class="text-slate-800 font-bold">${pet.speed}</span></span>
                                ${unlockedBadge}
                            </div>
                        </div>
                    `;
                    container.innerHTML += itemHtml;
                });

                this.updatePreviewPanel();
            }

            selectShopItem(petId) {
                this.audio.playClick();
                this.selectedPreviewPetId = petId;
                this.loadShopPreviewModel(petId);
                this.renderShop();
            }

            updatePreviewPanel() {
                const pet = PET_DATABASE.find(p => p.id === this.selectedPreviewPetId);
                if(!pet) return;

                document.getElementById('prev-name').innerText = pet.name;
                const rarityLabel = document.getElementById('prev-rarity');
                rarityLabel.innerText = pet.rarity;
                
                // Menghapus kelas warna Tailwind yang lama
                rarityLabel.className = "text-xs font-bold uppercase tracking-wider mb-3 " + pet.color;

                document.getElementById('prev-speed').innerText = pet.speed;
                document.getElementById('prev-tier').innerText = pet.price === 0 ? "Starter" : pet.price < 500 ? "Pro" : "Elite";

                const actionContainer = document.getElementById('shop-action-container');
                actionContainer.innerHTML = '';

                const isUnlocked = this.saveSystem.data.unlockedPets.includes(pet.id);
                const isActive = this.saveSystem.data.selectedPet === pet.id;

                if(isActive) {
                    actionContainer.innerHTML = `<button class="w-full py-2.5 text-sm font-bold bg-slate-400 text-white rounded-full cursor-not-allowed" disabled><i class="fa-solid fa-check-double mr-1"></i> Sedang Digunakan</button>`;
                } else if(isUnlocked) {
                    actionContainer.innerHTML = `<button class="w-full py-2.5 text-sm font-bold bg-gradient-to-r from-orange-500 to-red-600 text-white rounded-full hover:shadow-lg hover:shadow-orange-500/20 active:scale-95 transition-all shadow-md" onclick="game.useSelectedPet('${pet.id}')"><i class="fa-solid fa-paw mr-1"></i> Pilih Gunakan</button>`;
                } else {
                    actionContainer.innerHTML = `<button class="w-full py-2.5 text-sm font-bold bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-full hover:shadow-lg hover:shadow-emerald-500/20 active:scale-95 transition-all shadow-md" onclick="game.buySelectedPet('${pet.id}', ${pet.price})"><i class="fa-solid fa-cart-shopping mr-1"></i> Beli $${pet.price}</button>`;
                }
            }

            useSelectedPet(petId) {
                this.audio.playClick();
                this.saveSystem.data.selectedPet = petId;
                this.saveSystem.save();
                this.renderShop();
            }

            buySelectedPet(petId, price) {
                if(this.saveSystem.data.money >= price) {
                    this.saveSystem.data.money -= price;
                    this.saveSystem.data.unlockedPets.push(petId);
                    this.saveSystem.data.selectedPet = petId;
                    this.saveSystem.save();
                    this.audio.playBuy();
                    this.renderShop();
                } else {
                    this.audio.playError();
                    ModalSystem.show("Transaksi Gagal", "Uang kamu tidak mencukupi untuk mengadopsi hewan peliharaan ini!");
                }
            }

            openShop() { 
                this.audio.playClick(); 
                document.getElementById('shop-screen').classList.remove('hidden'); 
                // Otomatis arahkan pratinjau 3D ke pet yang sedang aktif digunakan saat toko baru dibuka
                this.selectedPreviewPetId = this.saveSystem.data.selectedPet;
                this.loadShopPreviewModel(this.selectedPreviewPetId);
                this.renderShop();
            }
            
            closeShop() { 
                this.audio.playClick(); 
                document.getElementById('shop-screen').classList.add('hidden'); 
            }

            resetProgress() {
                ModalSystem.show(
                    "Atur Ulang Kemajuan?", 
                    "Apakah Anda yakin ingin menghapus seluruh data petualangan, koleksi pet, dan koin Anda?",
                    (isConfirmed) => {
                        if (isConfirmed) {
                            this.saveSystem.reset();
                            this.renderShop();
                            ModalSystem.show("Selesai", "Seluruh progress data telah dibersihkan.");
                        }
                    }, 
                    true
                );
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // 1. Live Preview di Toko
                if(!document.getElementById('shop-screen').classList.contains('hidden')) {
                    this.previewGroup.rotation.y += 0.015;
                    this.shopRenderer.render(this.shopScene, this.shopCamera);
                }

                // 2. Render Dunia Utama Game
                if(this.isPlaying && this.playerMesh) {
                    const petConfig = PET_DATABASE.find(p => p.id === this.saveSystem.data.selectedPet) || PET_DATABASE[0];
                    const dt = 0.016; 
                    
                    let moveVec = this.input.vector;
                    
                    // Sistem Belok Kemudi (Steering Controls)
                    if(moveVec.x !== 0) {
                        // Belok Kiri/Belok Kanan memutar hadap pet
                        const turnSpeed = 2.8; 
                        this.playerMesh.rotation.y -= moveVec.x * turnSpeed * dt;
                    }

                    if(moveVec.y !== 0) {
                        // Vektor "depan" mengarah lurus ke depan lokal (-Z)
                        let localForward = new THREE.Vector3(0, 0, -1);
                        localForward.applyQuaternion(this.playerMesh.quaternion);

                        let speed = petConfig.speed;
                        // Tombol W/Up membuat moveVec.y < 0 (-1), sehingga directionSign bernilai positif (Maju)
                        let directionSign = -moveVec.y; 
                        
                        let nextX = this.playerMesh.position.x + localForward.x * speed * dt * directionSign;
                        let nextZ = this.playerMesh.position.z + localForward.z * speed * dt * directionSign;
                        
                        // Tabrakan dinding sumbu independen dengan deteksi Bounding Circle agar anti slip / tembus dinding
                        if (!this.checkWallCollision(nextX, this.playerMesh.position.z)) {
                            this.playerMesh.position.x = nextX;
                        }
                        if (!this.checkWallCollision(this.playerMesh.position.x, nextZ)) {
                            this.playerMesh.position.z = nextZ;
                        }

                        // Efek melompat/goyangan berjalan
                        this.playerMesh.position.y = Math.abs(Math.sin(Date.now() * 0.012)) * 0.2;
                    } else {
                        this.playerMesh.position.y = 0;
                    }

                    // Nilai target ditarik secara dinamis dari GAME_SETTINGS agar bisa digeser lewat slider UI
                    const targetDist = GAME_SETTINGS.cameraDistance;   
                    const targetHeight = GAME_SETTINGS.cameraHeight; 

                    // Hitung target posisi kamera persis di belakang punggung pet
                    let localBackward = new THREE.Vector3(0, 0, 1);
                    localBackward.applyQuaternion(this.playerMesh.quaternion);

                    const targetCamX = this.playerMesh.position.x + localBackward.x * targetDist;
                    const targetCamZ = this.playerMesh.position.z + localBackward.z * targetDist;
                    const targetCamY = this.playerMesh.position.y + targetHeight;

                    // Interpolasi lembut (Lerp) kamera berayun sinematis tanpa patah-patah
                    const lerpFactor = 0.08; 
                    this.camera.position.x += (targetCamX - this.camera.position.x) * lerpFactor;
                    this.camera.position.z += (targetCamZ - this.camera.position.z) * lerpFactor;
                    this.camera.position.y += (targetCamY - this.camera.position.y) * lerpFactor;

                    // Sorotan pandangan mengunci pada tubuh pet
                    this.camera.lookAt(this.playerMesh.position);

                    // Lampu dinamis matahari mengikuti pergerakan player
                    this.dirLight.position.set(this.playerMesh.position.x + 15, 25, this.playerMesh.position.z + 15);
                    this.dirLight.target = this.playerMesh;

                    // Rotasi & Tabrakan Gem Collectible
                    for(let i = this.gemsGroup.length - 1; i >= 0; i--) {
                        let gem = this.gemsGroup[i];
                        
                        // Efek mengambang naik turun (Floating Sine wave)
                        const offset = gem.userData.pulseOffset;
                        gem.position.y = gem.userData.baseY + Math.sin(Date.now() * 0.003 + offset) * 0.15;
                        gem.rotation.y += 0.04;
                        gem.rotation.z += 0.02;

                        let dist = this.playerMesh.position.distanceTo(gem.position);
                        if(dist < 1.3) {
                            this.audio.playCollect();
                            this.currentGemsCollected += gem.userData.value;
                            this.spawnBurstParticle(gem.position, gem.material.color);
                            this.scene.remove(gem);
                            this.gemsGroup.splice(i, 1);
                            this.updateHUD();
                        }
                    }

                    // Update Burst Particles
                    this.updateParticles(dt);

                    // Update Dungeon Dust Particles
                    for(let dust of this.dungeonDust) {
                        dust.position.y += dust.userData.speedY * dt;
                        dust.rotation.y += dust.userData.rotSpeed;
                        dust.rotation.x += dust.userData.rotSpeed;
                        if(dust.position.y > 4.5) {
                            dust.position.y = 0;
                            dust.position.x = Math.random() * this.mazeWidth * this.blockSize;
                            dust.position.z = Math.random() * this.mazeHeight * this.blockSize;
                        }
                    }

                    // Animasi Cincin Portal Finish
                    this.exitRings.forEach((ring, idx) => {
                        ring.rotation.z += 0.015 * (idx === 0 ? 1 : -1);
                        ring.scale.setScalar(1 + Math.sin(Date.now() * 0.005 + idx * Math.PI) * 0.08);
                    });

                    // Deteksi Portal Finish Keluar Level
                    if(this.exitMesh) {
                        let distToExit = this.playerMesh.position.distanceTo(this.exitMesh.position);
                        if(distToExit < 1.3) {
                            this.endSession(true);
                        }
                    }

                    // Hanya panggil penggambaran minimap jika disetujui konfigurasi & sudah tidak terkunci
                    if(GAME_SETTINGS.enableMinimap && this.miniMapUnlocked) {
                        this.drawMiniMap();
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }

            // Deteksi tabrakan presisi menggunakan sampling melingkar (Bounding Circle) di sekeliling Pet
            checkWallCollision(px, pz) {
                const radius = 0.65; // Radius fisik dari badan Pet
                const angles = [0, Math.PI/4, Math.PI/2, 3*Math.PI/4, Math.PI, 5*Math.PI/4, 3*Math.PI/2, 7*Math.PI/4];
                
                for(let angle of angles) {
                    let cx = px + Math.cos(angle) * radius;
                    let cz = pz + Math.sin(angle) * radius;
                    
                    let gridX = Math.round(cx / this.blockSize);
                    let gridY = Math.round(cz / this.blockSize);

                    if(gridX < 0 || gridX >= this.mazeWidth || gridY < 0 || gridY >= this.mazeHeight) return true;
                    if(this.mazeData[gridY][gridX] === 1) return true;
                }
                return false;
            }

            spawnBurstParticle(pos, color) {
                for(let i=0; i<12; i++) {
                    let pGeo = new THREE.BoxGeometry(0.18, 0.18, 0.18);
                    let pMat = new THREE.MeshBasicMaterial({ color: color });
                    let p = new THREE.Mesh(pGeo, pMat);
                    p.position.copy(pos);
                    
                    p.userData = {
                        vx: (Math.random() - 0.5) * 6,
                        vy: Math.random() * 5 + 3,
                        vz: (Math.random() - 0.5) * 6,
                        life: 0.45
                    };
                    this.scene.add(p);
                    this.particles.push(p);
                }
            }

            updateParticles(dt) {
                for(let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.position.x += p.userData.vx * dt;
                    p.position.y += p.userData.vy * dt;
                    p.position.z += p.userData.vz * dt;
                    p.userData.vy -= 9.8 * dt;
                    p.userData.life -= dt;

                    if(p.userData.life <= 0) {
                        this.scene.remove(p);
                        this.particles.splice(i, 1);
                    }
                }
            }

            drawMiniMap() {
                const canvas = document.getElementById('minimap-canvas');
                const ctx = canvas.getContext('2d');
                if(!canvas || !ctx) return;

                if(canvas.width !== canvas.clientWidth) {
                    canvas.width = canvas.clientWidth;
                    canvas.height = canvas.clientHeight;
                }

                ctx.clearRect(0,0, canvas.width, canvas.height);

                let cw = canvas.width / this.mazeWidth;
                let ch = canvas.height / this.mazeHeight;

                for(let y=0; y<this.mazeHeight; y++) {
                    for(let x=0; x<this.mazeWidth; x++) {
                        if(this.mazeData[y][x] === 1) {
                            ctx.fillStyle = "#cbd5e1"; // Tembok abu-abu mutiara terang
                            ctx.fillRect(x*cw, y*ch, cw - 0.5, ch - 0.5);
                        }
                    }
                }

                // Portal Keluar (Emas Lingkaran)
                ctx.fillStyle = "#f59e0b";
                ctx.beginPath();
                ctx.arc((this.mazeWidth-2)*cw + cw/2, (this.mazeHeight-2)*ch + ch/2, cw/2.5, 0, Math.PI*2);
                ctx.fill();

                // Player Dot (Biru bersinar terang)
                if(this.playerMesh) {
                    let px = Math.round(this.playerMesh.position.x / this.blockSize);
                    let py = Math.round(this.playerMesh.position.z / this.blockSize);
                    ctx.fillStyle = "#3b82f6";
                    ctx.beginPath();
                    ctx.arc(px*cw + cw/2, py*ch + ch/2, cw/3, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        let game;
        window.addEventListener('DOMContentLoaded', () => {
            game = new PetDungeonGame();
        });
    </script>
